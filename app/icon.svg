<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glowViolet" cx="0" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="1" />
      <stop offset="0.45" stop-color="#6d28d9" stop-opacity="0.55" />
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="1" cy="1" r="0.75">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="1" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="monogram" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#f5d0fe" />
      <stop offset="1" stop-color="#e879f9" />
    </linearGradient>
  </defs>

  <!-- Tile: deep purple base with the site's violet and pink glows -->
  <rect width="64" height="64" rx="16" fill="#0b0418" />
  <rect width="64" height="64" rx="16" fill="url(#glowViolet)" />
  <rect width="64" height="64" rx="16" fill="url(#glowPink)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- "S" monogram -->
  <path
    d="M41.5 19.5 C37.5 14.5 22 14.5 21.5 23.5 C21 31.5 42.5 29.5 42.5 40 C42.5 50 25.5 50.5 20.5 44"
    fill="none"
    stroke="url(#monogram)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Accent dot -->
  <circle cx="49" cy="47" r="3.6" fill="#f472b6" />
</svg>
